name: RecoverFlow CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Backend smoke import
        run: python -c "from app.main import app; print(app.title)"
      - name: Collection engine smoke test
        run: >-
          python -c 'from datetime import date; from decimal import Decimal; from app.collection_engine import recommend_next_action; r=recommend_next_action(overdue=45,balance=Decimal(100000),max_balance=Decimal(200000),promise_broken=True,dispute=False,payment_claimed=False,promised_date=date.today(),last_contact_at=None,due_date=date.today()); assert r["priority"]=="Critical" and r["action_type"]=="CALL"; print(r)'

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install mobile dependencies
        run: npm install
      - name: Typecheck mobile
        run: npx tsc --noEmit
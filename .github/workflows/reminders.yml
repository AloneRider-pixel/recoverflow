name: RecoverFlow daily operations

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_CRON_SECRET: ${{ secrets.RECOVERFLOW_CRON_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install backend
        run: python -m pip install -r requirements.txt

      - name: Verify scheduled endpoint integration
        env:
          DATABASE_URL: sqlite:///./recoverflow_ci.db
          CRON_SECRET: ci-test-secret
        run: |
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient

          from app.main import app

          client = TestClient(app)
          headers = {"x-cron-secret": os.environ["CRON_SECRET"]}

          for path in ("/internal/recurring", "/internal/reminders"):
              unauthorized = client.post(path)
              assert unauthorized.status_code == 401, (path, unauthorized.status_code)
              response = client.post(path, headers=headers)
              assert response.status_code == 200, (path, response.status_code, response.text)
              assert response.json().get("ok") is True
              print(path, response.json())
          PY

      - name: Run production recurring invoice generation
        if: env.PRODUCTION_CRON_SECRET != ''
        env:
          RECOVERFLOW_CRON_SECRET: ${{ secrets.RECOVERFLOW_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors -X POST             -H "X-Cron-Secret: $RECOVERFLOW_CRON_SECRET"             "https://recoverflow-7vnr.onrender.com/internal/recurring"

      - name: Run production overdue reminders
        if: env.PRODUCTION_CRON_SECRET != ''
        env:
          RECOVERFLOW_CRON_SECRET: ${{ secrets.RECOVERFLOW_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors -X POST             -H "X-Cron-Secret: $RECOVERFLOW_CRON_SECRET"             "https://recoverflow-7vnr.onrender.com/internal/reminders"

      - name: Record production configuration status
        if: env.PRODUCTION_CRON_SECRET == ''
        run: |
          {
            echo "## Production scheduler configuration"
            echo ""
            echo "Production reminder endpoints were not called because RECOVERFLOW_CRON_SECRET is not configured."
            echo "The internal scheduled endpoints passed their authenticated integration checks against an isolated SQLite database."
          } >> "$GITHUB_STEP_SUMMARY"

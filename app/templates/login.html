{% extends 'base.html' %}{% block content %}
<section class="min-h-[calc(100vh-9rem)] grid place-items-center px-4 py-12"><div class="w-full max-w-md">
  <div class="text-center mb-8"><div class="text-xs font-bold tracking-[.2em] text-rf-300">WELCOME BACK</div><h1 class="text-4xl font-black tracking-tight mt-2">Sign in to RecoverFlow</h1><p class="text-slate-500 mt-3">Your collection workspace is waiting.</p></div>
  <div class="glass rounded-3xl p-6 sm:p-7 shadow-soft">
    {% if error %}<div class="mb-5 rounded-xl border border-rose-400/15 bg-rose-400/5 p-3.5 text-sm text-rose-200">{{error}}</div>{% endif %}
    <form method="post" class="space-y-4">
      <label class="block"><span class="text-xs font-bold text-slate-400">Email</span><input name="email" type="email" autocomplete="email" required class="mt-2 w-full rounded-xl bg-rf-950 border border-rf-700 px-4 py-3" placeholder="you@company.com"></label>
      <label class="block"><span class="text-xs font-bold text-slate-400">Password</span><input name="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded-xl bg-rf-950 border border-rf-700 px-4 py-3" placeholder="Your password"></label>
      <button class="w-full rounded-xl bg-white text-rf-950 font-extrabold py-3.5 hover:-translate-y-px transition">Sign in</button>
    </form>
    <div class="flex items-center gap-3 my-6 text-xs text-slate-600"><span class="h-px bg-white/5 flex-1"></span><span>NEW TO RECOVERFLOW?</span><span class="h-px bg-white/5 flex-1"></span></div>
    <a href="/register" class="block text-center rounded-xl border border-rf-700 bg-white/[.02] py-3 font-bold hover:bg-white/[.04]">Create your workspace</a>
  </div>
</div></section>{% endblock %}

{% extends 'base.html' %}{% block content %}<div class="max-w-md mx-auto mt-12"><h1 class="text-3xl font-bold">Create your account</h1><p class="text-slate-400 mt-2 mb-8">Your invoices stay isolated to your business account.</p>{% if error %}<div class="mb-4 rounded-lg bg-rose-950/60 border border-rose-800 p-3 text-sm">{{error}}</div>{% endif %}<form method="post" class="space-y-4"><label class="block text-sm">Company name<input name="company_name" required class="mt-2 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2"></label><label class="block text-sm">Email<input name="email" type="email" required class="mt-2 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2"></label><label class="block text-sm">Password<input name="password" type="password" minlength="8" required class="mt-2 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2"></label><button class="w-full px-4 py-2.5 rounded-lg bg-white text-slate-950 font-semibold">Create account</button></form><p class="text-sm text-slate-500 mt-6">Already have an account? <a href="/login" class="text-sky-300">Sign in</a></p></div>{% endblock %}

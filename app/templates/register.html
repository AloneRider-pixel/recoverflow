{% extends 'base.html' %}{% block content %}
<section class="min-h-[calc(100vh-9rem)] grid place-items-center px-4 py-12"><div class="w-full max-w-md">
  <div class="text-center mb-8"><div class="text-xs font-bold tracking-[.2em] text-rf-300">START YOUR WORKSPACE</div><h1 class="text-4xl font-black tracking-tight mt-2">Create your account</h1><p class="text-slate-500 mt-3">Bring invoices, follow-ups and collections into one place.</p></div>
  <div class="glass rounded-3xl p-6 sm:p-7 shadow-soft">
    {% if error %}<div class="mb-5 rounded-xl border border-rose-400/15 bg-rose-400/5 p-3.5 text-sm text-rose-200">{{error}}</div>{% endif %}
    <form method="post" class="space-y-4">
      <label class="block"><span class="text-xs font-bold text-slate-400">Company name</span><input name="company_name" required autocomplete="organization" class="mt-2 w-full rounded-xl bg-rf-950 border border-rf-700 px-4 py-3" placeholder="Your business"></label>
      <label class="block"><span class="text-xs font-bold text-slate-400">Work email</span><input name="email" type="email" required autocomplete="email" class="mt-2 w-full rounded-xl bg-rf-950 border border-rf-700 px-4 py-3" placeholder="you@company.com"></label>
      <label class="block"><span class="text-xs font-bold text-slate-400">Password</span><input name="password" type="password" minlength="8" required autocomplete="new-password" class="mt-2 w-full rounded-xl bg-rf-950 border border-rf-700 px-4 py-3" placeholder="At least 8 characters"></label>
      <button class="w-full rounded-xl bg-white text-rf-950 font-extrabold py-3.5">Create workspace</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6">Already have an account? <a href="/login" class="text-rf-300 font-semibold">Sign in</a></p>
  </div>
</div></section>{% endblock %}

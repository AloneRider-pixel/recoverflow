{% extends 'base.html' %}{% block content %}<section class="min-h-[calc(100vh-9rem)] grid place-items-center px-4 py-12"><div class="w-full max-w-md"><div class="text-center mb-8"><div class="text-xs font-bold tracking-[.2em] text-rf-300">WORKSPACE INVITE</div><h1 class="text-4xl font-black mt-2">Join {{invite.workspace_id and 'RecoverFlow'}}</h1><p class="text-slate-500 mt-3">{{invite.email}} · {{invite.role}}</p></div><div class="glass rounded-3xl p-6 shadow-soft">{% if error %}<div class="mb-5 rounded-xl border border-rose-400/15 bg-rose-400/5 p-3.5 text-sm text-rose-200">{{error}}</div>{% endif %}<form method="post" class="space-y-4"><label class="block"><span class="text-xs font-bold text-slate-400">Password</span><input name="password" type="password" minlength="8" required class="mt-2 w-full rounded-xl bg-rf-950 border border-rf-700 px-4 py-3" placeholder="At least 8 characters"></label><button class="w-full rounded-xl bg-white text-rf-950 font-extrabold py-3.5">Join workspace</button></form><p class="text-xs text-slate-600 mt-5">Your role will be {{invite.role}}. The invite can only be used once.</p></div></div></section>{% endblock %}
